name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The project has no Gradle wrapper yet, so install Gradle directly.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      # On failure, publish the compiler errors to a branch so they can be read without downloading logs.
      - name: Save build errors
        if: failure()
        run: |
          {
            echo "run: ${{ github.run_id }}  commit: ${{ github.sha }}"
            echo "=== errors ==="
            grep -nE "^e: |^w: .*(Unresolved|error)|error:|FAILED|What went wrong|Could not (resolve|find|get)|Caused by" build.log | head -300
            echo "=== last 150 lines (stack frames removed) ==="
            grep -vE '^\s+at |^\s+\.\.\. [0-9]+ more' build.log | tail -150
          } > errors.txt
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rf --quiet . || true
          mv errors.txt ERRORS.txt
          git add ERRORS.txt
          git commit -q -m "build errors for ${{ github.sha }}"
          git push -f origin build-logs

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiseLaniakea-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MoiseLaniakea-debug-apk
          path: apk

      - name: Make a test song
        run: python3 ci/make_wav.py

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ci/smoke.sh

      - name: Publish smoke test results
        if: always()
        run: |
          mkdir -p /tmp/results && cp -r out/. /tmp/results/ 2>/dev/null || echo "no output produced" > /tmp/results/NOTHING.txt
          echo "commit: ${{ github.sha }}" > /tmp/results/COMMIT.txt
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan smoke-logs
          git rm -rf --quiet . || true
          cp -r /tmp/results/. .
          git add -A
          git commit -q -m "smoke test for ${{ github.sha }}"
          git push -f origin smoke-logs
